<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主流大模型 API 价格速查</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-soft: #171a23;
    --card: #1b1f2b;
    --card-hover: #202636;
    --border: #2a2f40;
    --text: #e8eaf0;
    --text-dim: #9aa1b5;
    --text-faint: #6b7287;
    --accent: #6d8bff;
    --accent-soft: rgba(109,139,255,.14);
    --green: #34d399;
    --red: #f87171;
    --radius: 14px;
    --shadow: 0 8px 30px rgba(0,0,0,.35);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: radial-gradient(1200px 600px at 80% -10%, var(--accent-soft), transparent 60%),
                radial-gradient(900px 500px at 0% 0%, rgba(52,211,153,.06), transparent 55%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.55;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header { padding: 44px 0 8px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), #9b6dff);
    display: grid; place-items: center; font-size: 20px; font-weight: 800; color: #fff;
    box-shadow: 0 4px 16px rgba(109,139,255,.4);
  }
  h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: .3px; }
  .subtitle { color: var(--text-dim); margin-top: 10px; font-size: 15px; }
  .updated {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: 14px; padding: 6px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13px; font-weight: 600;
  }
  .updated::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(52,211,153,.2); }

  /* Controls */
  .controls { position: sticky; top: 0; z-index: 20; padding: 14px 0; background: linear-gradient(var(--bg) 70%, transparent); }
  .controls-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  #search {
    flex: 1; min-width: 200px; padding: 11px 16px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 14px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #search::placeholder { color: var(--text-faint); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 14px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-dim); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip .count { font-size: 11px; opacity: .7; font-weight: 700; }

  /* View toggle */
  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--card); }
  .view-toggle button {
    padding: 9px 16px; border: none; background: transparent; color: var(--text-dim);
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .view-toggle button + button { border-left: 1px solid var(--border); }
  .view-toggle button.active { background: var(--accent); color: #fff; }

  /* Sort row */
  .sort-row { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; font-size: 13px; color: var(--text-dim); }
  .sort-row button {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    padding: 5px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .sort-row button:hover, .sort-row button.active { border-color: var(--accent); color: var(--accent); }
  .sort-row .hint { margin-left: auto; font-size: 12px; color: var(--text-faint); }

  /* Provider sections (card) */
  .provider { margin: 30px 0; }
  .provider-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .provider-logo {
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    font-size: 18px; font-weight: 800; color: #fff; flex-shrink: 0;
  }
  .provider-name { font-size: 19px; font-weight: 800; }
  .provider-site { font-size: 12px; color: var(--text-faint); text-decoration: none; margin-left: 4px; }
  .provider-site:hover { color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 16px 14px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s, background .15s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); background: var(--card-hover); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .model-name { font-size: 15px; font-weight: 700; }
  .model-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 700; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent);
  }
  .model-badge.flag { background: rgba(248,113,113,.14); color: var(--red); }
  .model-badge.green { background: rgba(52,211,153,.14); color: var(--green); }
  .api-id { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); word-break: break-all; }
  .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .price-box { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; }
  .price-label { font-size: 11px; color: var(--text-faint); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .price-value { font-family: var(--mono); font-size: 17px; font-weight: 700; margin-top: 2px; }
  .price-value small { font-size: 11px; color: var(--text-faint); font-weight: 500; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta-tag { font-size: 11px; color: var(--text-dim); background: var(--bg-soft); border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; }
  .note { font-size: 12px; color: var(--text-faint); line-height: 1.5; }

  /* Table view */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 760px; }
  thead th {
    text-align: left; padding: 12px 14px; font-size: 12px; font-weight: 700; color: var(--text-dim);
    border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none;
    background: var(--bg-soft);
  }
  thead th:hover { color: var(--accent); }
  thead th .arrow { font-size: 10px; margin-left: 3px; opacity: .6; }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--card-hover); }
  .t-provider { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 600; }
  .t-provider .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .t-model-name { font-weight: 700; }
  .t-api { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }
  .t-price { font-family: var(--mono); font-weight: 700; white-space: nowrap; }
  .t-input { color: var(--text); }
  .t-output { color: var(--text); }
  .t-note { color: var(--text-faint); font-size: 12px; max-width: 260px; }
  .t-badge { font-size: 10.5px; padding: 2px 7px; border-radius: 5px; font-weight: 700; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .t-badge.flag { background: rgba(248,113,113,.14); color: var(--red); }
  .t-badge.green { background: rgba(52,211,153,.14); color: var(--green); }

  /* Calculator */
  .calc { margin: 34px 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .calc h2 { font-size: 18px; margin-bottom: 4px; }
  .calc .desc { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
  .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .calc-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .calc-field select, .calc-field input {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text); font-size: 14px; outline: none;
  }
  .calc-field select:focus, .calc-field input:focus { border-color: var(--accent); }
  .calc-result { margin-top: 18px; padding: 16px; border-radius: 10px; background: var(--bg-soft); border: 1px solid var(--border); }
  .calc-result .big { font-size: 26px; font-weight: 800; font-family: var(--mono); color: var(--accent); }
  .calc-result .detail { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
  .calc-result .detail b { color: var(--text); }

  footer { text-align: center; color: var(--text-faint); font-size: 12.5px; padding: 40px 0 50px; line-height: 1.8; }
  #empty { display: none; text-align: center; color: var(--text-dim); padding: 60px 0; font-size: 15px; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .controls { position: static; }
    .sort-row .hint { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">LLM</div>
      <h1>大模型 API 价格速查</h1>
    </div>
    <p class="subtitle">主流大模型推理 API 的单位价格（单位：美元 / 每百万 tokens）。数据由官方定价页与 OpenRouter 每天自动更新，仅供参考，实际以厂商账单为准。</p>
    <span class="updated">数据更新于 <span id="updated-date">—</span></span>
  </header>

  <div class="controls">
    <div class="controls-bar">
      <input id="search" type="text" placeholder="搜索模型名称或 API ID…">
      <div class="view-toggle" id="view-toggle">
        <button data-view="card" class="active">卡片</button>
        <button data-view="table">表格</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="sort-row">
      <span>排序：</span>
      <button data-sort="provider" class="active">按厂商</button>
      <button data-sort="price_in">输入价 ↑</button>
      <button data-sort="price_out">输出价 ↓</button>
      <span class="hint" id="sort-hint">表格模式下可点击表头排序</span>
    </div>
  </div>

  <div id="empty">没有找到匹配的模型，换个关键词试试？</div>

  <div id="content"></div>

  <section class="calc">
    <h2>💡 成本估算器</h2>
    <p class="desc">输入你的 token 用量，估算一次调用或一个月的费用。</p>
    <div class="calc-grid">
      <div class="calc-field">
        <label>选择模型</label>
        <select id="calc-model"></select>
      </div>
      <div class="calc-field">
        <label>输入 tokens（百万）</label>
        <input id="calc-in" type="number" min="0" step="0.1" value="1">
      </div>
      <div class="calc-field">
        <label>输出 tokens（百万）</label>
        <input id="calc-out" type="number" min="0" step="0.1" value="0.2">
      </div>
    </div>
    <div class="calc-result">
      <div class="big" id="calc-total">$0.00</div>
      <div class="detail" id="calc-detail"></div>
    </div>
  </section>

  <footer>
    数据来源：各厂商官方定价页 + OpenRouter Models API（每天自动更新）<br>
    价格会随厂商政策变动，请以官网最新页面为准
  </footer>
</div>

<script src="data.js"></script>
<script>
const PROVIDERS = (window.PRICING_DATA && window.PRICING_DATA.providers) || [];
const updatedAtEl = document.getElementById("updated-date");
if (window.PRICING_DATA && window.PRICING_DATA.updatedAt) updatedAtEl.textContent = window.PRICING_DATA.updatedAt;

/* ============ 状态 ============ */
const content = document.getElementById("content");
const chips = document.getElementById("chips");
const search = document.getElementById("search");
const empty = document.getElementById("empty");
let currentProvider = "all";
let currentSort = "provider";
let viewMode = "card";
let tableSort = { key: "provider", dir: 1 };

/* ============ 工具 ============ */
function fmt(v) {
  if (v === undefined || v === null) return "—";
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: v < 1 ? 2 : v < 10 ? 2 : 0, maximumFractionDigits: 4 });
}

function buildChips() {
  chips.innerHTML = "";
  const all = [{ id: "all", name: "全部", color: "#888" }].concat(PROVIDERS);
  all.forEach(p => {
    const count = p.id === "all" ? PROVIDERS.reduce((s, x) => s + x.models.length, 0) : p.models.length;
    const b = document.createElement("button");
    b.className = "chip" + (p.id === currentProvider ? " active" : "");
    b.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name} <span class="count">${count}</span>`;
    b.onclick = () => { currentProvider = p.id; buildChips(); render(); };
    chips.appendChild(b);
  });
}

function filteredModels() {
  let out = [];
  PROVIDERS.forEach(p => {
    if (currentProvider !== "all" && currentProvider !== p.id) return;
    p.models.forEach(m => {
      if (search.value.trim()) {
        const q = search.value.trim().toLowerCase();
        if (!(m.name.toLowerCase().includes(q) || m.api.toLowerCase().includes(q) || p.name.toLowerCase().includes(q))) return;
      }
      out.push({ provider: p, model: m });
    });
  });
  if (currentSort === "price_in") out.sort((a, b) => a.model.input - b.model.input);
  else if (currentSort === "price_out") out.sort((a, b) => b.model.output - a.model.output);
  return out;
}

/* ============ 卡片视图 ============ */
function card(provider, model) {
  const el = document.createElement("div");
  el.className = "card";
  const badgeCls = model.flag ? " flag" : (model.badge === "最便宜" || model.badge === "便宜" ? " green" : "");
  el.innerHTML = `
    <div class="card-top">
      <div>
        <div class="model-name">${model.name}</div>
        <div class="api-id">${model.api}</div>
      </div>
      ${model.badge ? `<span class="model-badge${badgeCls}">${model.badge}</span>` : ""}
    </div>
    <div class="prices">
      <div class="price-box">
        <div class="price-label">输入</div>
        <div class="price-value price-in">${fmt(model.input)} <small>/MTok</small></div>
      </div>
      <div class="price-box">
        <div class="price-label">输出</div>
        <div class="price-value price-out">${fmt(model.output)} <small>/MTok</small></div>
      </div>
    </div>
    <div class="meta">
      <span class="meta-tag">${provider.name}</span>
      ${model.ctx && model.ctx !== "—" ? `<span class="meta-tag">上下文 ${model.ctx}</span>` : ""}
    </div>
    ${model.note ? `<p class="note">${model.note}</p>` : ""}
  `;
  return el;
}

function renderCard(list) {
  content.innerHTML = "";
  if (currentSort === "provider") {
    PROVIDERS.forEach(p => {
      if (currentProvider !== "all" && currentProvider !== p.id) return;
      const items = list.filter(x => x.provider.id === p.id);
      if (!items.length) return;
      const section = document.createElement("div");
      section.className = "provider";
      section.innerHTML = `
        <div class="provider-head">
          <div class="provider-logo" style="background:${p.color}">${p.short.slice(0,1)}</div>
          <span class="provider-name">${p.name}</span>
          <a class="provider-site" href="${p.site}" target="_blank" rel="noopener">官方定价 ↗</a>
        </div>
        ${p.note ? `<p class="note" style="margin:0 0 12px">${p.note}</p>` : ""}
        <div class="grid"></div>`;
      const grid = section.querySelector(".grid");
      items.forEach(x => grid.appendChild(card(x.provider, x.model)));
      content.appendChild(section);
    });
  } else {
    const section = document.createElement("div");
    section.className = "provider";
    const grid = document.createElement("div");
    grid.className = "grid";
    list.forEach(x => grid.appendChild(card(x.provider, x.model)));
    section.appendChild(grid);
    content.appendChild(section);
  }
}

/* ============ 表格视图 ============ */
function sortTable(list) {
  const { key, dir } = tableSort;
  const val = x => {
    switch (key) {
      case "provider": return x.provider.name;
      case "model": return x.model.name;
      case "input": return x.model.input;
      case "output": return x.model.output;
      case "ctx": return x.model.ctx === "—" ? 0 : parseInt(x.model.ctx) || 0;
      default: return x.provider.name;
    }
  };
  return [...list].sort((a, b) => {
    const va = val(a), vb = val(b);
    if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
    return String(va).localeCompare(String(vb)) * dir;
  });
}

function renderTable(list) {
  content.innerHTML = "";
  const sorted = sortTable(list);
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  const arrow = (k) => tableSort.key === k ? (tableSort.dir === 1 ? "▲" : "▼") : "";
  const th = (label, key) => `<th data-key="${key}">${label}<span class="arrow">${arrow(key)}</span></th>`;
  wrap.innerHTML = `
    <table>
      <thead>
        <tr>${th("厂商", "provider")}${th("模型", "model")}${th("API ID", "")}${th("上下文", "ctx")}${th("输入 $/MTok", "input")}${th("输出 $/MTok", "output")}${th("备注", "")}</tr>
      </thead>
      <tbody></tbody>
    </table>`;
  const tbody = wrap.querySelector("tbody");
  sorted.forEach(x => {
    const m = x.model, p = x.provider;
    const badgeCls = m.flag ? " flag" : (m.badge === "最便宜" || m.badge === "便宜" ? " green" : "");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="t-provider"><span class="dot" style="background:${p.color}"></span>${p.name}</span></td>
      <td><span class="t-model-name">${m.name}</span>${m.badge ? ` <span class="t-badge${badgeCls}">${m.badge}</span>` : ""}</td>
      <td class="t-api">${m.api}</td>
      <td>${m.ctx && m.ctx !== "—" ? m.ctx : "—"}</td>
      <td class="t-price t-input">${fmt(m.input)}</td>
      <td class="t-price t-output">${fmt(m.output)}</td>
      <td class="t-note">${m.note || ""}</td>`;
    tbody.appendChild(tr);
  });
  wrap.querySelectorAll("thead th[data-key]").forEach(h => {
    h.addEventListener("click", () => {
      const k = h.dataset.key;
      if (tableSort.key === k) tableSort.dir *= -1;
      else { tableSort.key = k; tableSort.dir = 1; }
      renderTable(filteredModels());
    });
  });
  content.appendChild(wrap);
}

function render() {
  const list = filteredModels();
  empty.style.display = list.length ? "none" : "block";
  if (viewMode === "table") renderTable(list);
  else renderCard(list);
}

/* ============ 事件 ============ */
search.addEventListener("input", render);
document.querySelectorAll(".sort-row button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".sort-row button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentSort = btn.dataset.sort;
    render();
  });
});
document.querySelectorAll("#view-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#view-toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    viewMode = btn.dataset.view;
    const hint = document.getElementById("sort-hint");
    hint.style.display = viewMode === "table" ? "" : "none";
    render();
  });
});

/* ============ 成本估算器 ============ */
const calcModel = document.getElementById("calc-model");
const calcIn = document.getElementById("calc-in");
const calcOut = document.getElementById("calc-out");
const calcTotal = document.getElementById("calc-total");
const calcDetail = document.getElementById("calc-detail");

function buildCalcOptions() {
  PROVIDERS.forEach(p => {
    p.models.forEach(m => {
      const opt = document.createElement("option");
      opt.value = JSON.stringify({ in: m.input, out: m.output });
      opt.textContent = `${p.name} · ${m.name}`;
      calcModel.appendChild(opt);
    });
  });
}
function updateCalc() {
  const d = JSON.parse(calcModel.value);
  const inM = parseFloat(calcIn.value) || 0;
  const outM = parseFloat(calcOut.value) || 0;
  const total = d.in * inM + d.out * outM;
  calcTotal.textContent = "$" + total.toFixed(2);
  calcDetail.innerHTML = `输入 ${inM}M × <b>$${d.in}</b> + 输出 ${outM}M × <b>$${d.out}</b>`;
}
[calcModel, calcIn, calcOut].forEach(el => el.addEventListener("input", updateCalc));

/* ============ 初始化 ============ */
buildChips();
buildCalcOptions();
render();
updateCalc();
</script>
</body>
</html>
