<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主流大模型 API 价格速查</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-2: #f4f6fa;
    --border: #e5e8ef;
    --border-strong: #d1d6e0;
    --text: #0f172a;
    --text-2: #475569;
    --text-dim: #64748b;
    --text-faint: #94a3b8;
    --accent: #4f6ef7;
    --accent-strong: #3b5bdb;
    --accent-soft: rgba(79,110,247,.10);
    --green: #0ea371;
    --green-soft: rgba(14,163,113,.12);
    --red: #e11d48;
    --red-soft: rgba(225,29,72,.10);
    --amber: #d97706;
    --amber-soft: rgba(217,119,6,.12);
    --blue: #2563eb;
    --blue-soft: rgba(37,99,235,.12);
    --teal: #0d9488;
    --teal-soft: rgba(13,148,136,.12);
    --orange: #f59e0b;
    --orange-soft: rgba(245,158,11,.14);
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    --shadow-hover: 0 8px 28px rgba(15,23,42,.10);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(79,110,247,.08), transparent 60%),
      radial-gradient(900px 480px at -5% 0%, rgba(14,163,113,.05), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.55;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  header { padding: 48px 0 10px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: grid; place-items: center; font-size: 20px; font-weight: 800; color: #fff;
    box-shadow: 0 6px 18px rgba(79,110,247,.35);
    letter-spacing: .5px;
  }
  h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: .3px; color: var(--text); }
  .subtitle { color: var(--text-2); margin-top: 10px; font-size: 15px; }
  .badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .updated {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-strong);
    font-size: 13px; font-weight: 600;
  }
  .updated::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(14,163,113,.18); }
  .rate-badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    font-size: 13px; font-weight: 600;
  }

  /* Controls */
  .controls { position: sticky; top: 0; z-index: 20; padding: 14px 0; background: rgba(245,247,250,.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .controls-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  #search {
    flex: 1; min-width: 180px; padding: 11px 16px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #search::placeholder { color: var(--text-faint); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 13px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); transform: translateY(-1px); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(79,110,247,.3); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip .count { font-size: 11px; opacity: .7; font-weight: 700; }

  /* View toggle */
  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .view-toggle button {
    padding: 9px 16px; border: none; background: transparent; color: var(--text-dim);
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .view-toggle button + button { border-left: 1px solid var(--border); }
  .view-toggle button.active { background: var(--accent); color: #fff; }

  /* Sort row */
  .sort-row { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; font-size: 13px; color: var(--text-dim); flex-wrap: wrap; }
  .sort-row button {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    padding: 5px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .sort-row button:hover, .sort-row button.active { border-color: var(--accent); color: var(--accent); }
  .sort-row .hint { margin-left: auto; font-size: 12px; color: var(--text-faint); }
  .sort-row .spacer { flex: 1; }
  .btn-hidden { border-color: var(--red) !important; color: var(--red) !important; }
  .btn-hidden.active { background: var(--red); color: #fff !important; border-color: var(--red) !important; }

  /* Provider sections (card) */
  .provider { margin: 32px 0; }
  .provider-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .provider-logo {
    width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
    font-size: 18px; font-weight: 800; color: #fff; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(15,23,42,.12);
  }
  .provider-name { font-size: 19px; font-weight: 800; color: var(--text); }
  .provider-site { font-size: 12px; color: var(--text-faint); text-decoration: none; margin-left: 4px; }
  .provider-site:hover { color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 18px 16px; box-shadow: var(--shadow);
    transition: transform .18s, border-color .18s, box-shadow .18s, background .18s;
    display: flex; flex-direction: column; gap: 12px;
    animation: fadeUp .4s ease both;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow-hover); }
  .card.hidden-model { opacity: .55; border-style: dashed; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .model-name { font-size: 16px; font-weight: 800; letter-spacing: .2px; color: var(--text); }
  .model-badge {
    font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 700; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent-strong);
  }
  .model-badge.flag { background: var(--red-soft); color: var(--red); }
  .model-badge.green { background: var(--green-soft); color: var(--green); }
  .model-badge.brand { background: var(--accent-soft); color: var(--accent-strong); }
  .model-badge.amber { background: var(--amber-soft); color: var(--amber); }
  .model-badge.blue { background: var(--blue-soft); color: var(--blue); }
  .model-badge.teal { background: var(--teal-soft); color: var(--teal); }
  .model-badge.neutral { background: rgba(100,116,139,.14); color: var(--text-dim); }
  .model-badge.hidden { background: rgba(100,116,139,.14); color: var(--text-dim); }
  .api-id { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); word-break: break-all; }
  .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .price-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; }
  .price-label {
    font-size: 11px; color: var(--text-faint); font-weight: 700; letter-spacing: .5px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .price-label .tag { font-size: 10px; color: var(--text-faint); font-weight: 500; }
  .price-value { font-family: var(--mono); font-size: 25px; font-weight: 800; margin-top: 5px; line-height: 1.1; color: var(--text); font-variant-numeric: tabular-nums; }
  .price-unit { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-top: 6px; }
  .price-unit .usd { color: var(--green); font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .meta-tag { font-size: 11px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; }
  .btn-hide {
    margin-left: auto; font-size: 11px; color: var(--text-faint); background: none; border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 6px; cursor: pointer; transition: all .15s;
  }
  .btn-hide:hover { color: var(--red); border-color: var(--red); }
  .btn-hide.restore { color: var(--green); }
  .btn-hide.restore:hover { border-color: var(--green); }
  .note { font-size: 12px; color: var(--text-faint); line-height: 1.5; }

  /* Table view */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 880px; }
  thead th {
    text-align: left; padding: 13px 14px; font-size: 12px; font-weight: 700; color: var(--text-dim);
    border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none;
    background: var(--surface-2);
  }
  thead th:hover { color: var(--accent); }
  thead th .arrow { font-size: 10px; margin-left: 3px; opacity: .6; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:nth-child(even) { background: rgba(15,23,42,.02); }
  tbody tr.hidden-model { opacity: .5; }
  tbody tr { animation: fadeUp .3s ease both; }
  .t-provider { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 600; }
  .t-provider .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .t-model-name { font-weight: 700; color: var(--text); }
  .t-api { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }
  .t-price { font-family: var(--mono); font-weight: 700; white-space: nowrap; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
  .t-price .usd { font-size: 11px; color: var(--text-faint); font-weight: 500; margin-left: 5px; }
  .t-note { color: var(--text-faint); font-size: 12px; max-width: 240px; }
  .t-badge {
    font-size: 10.5px; padding: 2px 7px; border-radius: 5px; font-weight: 700; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent-strong);
  }
  .t-badge.flag { background: var(--red-soft); color: var(--red); }
  .t-badge.green { background: var(--green-soft); color: var(--green); }
  .t-badge.brand { background: var(--accent-soft); color: var(--accent-strong); }
  .t-badge.amber { background: var(--amber-soft); color: var(--amber); }
  .t-badge.blue { background: var(--blue-soft); color: var(--blue); }
  .t-badge.teal { background: var(--teal-soft); color: var(--teal); }
  .t-badge.neutral { background: rgba(100,116,139,.14); color: var(--text-dim); }
  .t-badge.hidden { background: rgba(100,116,139,.14); color: var(--text-dim); }
  .t-badge.t-unofficial { background: var(--orange-soft); color: var(--orange); }
  .btn-hide-cell { font-size: 11px; color: var(--text-faint); background: none; border: 1px solid var(--border); padding: 3px 9px; border-radius: 6px; cursor: pointer; }
  .btn-hide-cell:hover { color: var(--red); border-color: var(--red); }
  .btn-hide-cell.restore { color: var(--green); }
  .btn-hide-cell.restore:hover { border-color: var(--green); }

  /* Calculator */
  .calc { margin: 34px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
  .calc h2 { font-size: 18px; margin-bottom: 4px; color: var(--text); }
  .calc .desc { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
  .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .calc-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .calc-field select, .calc-field input {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 14px; outline: none;
  }
  .calc-field select:focus, .calc-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .calc-result { margin-top: 18px; padding: 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
  .calc-result .big { font-size: 27px; font-weight: 800; font-family: var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
  .calc-result .detail { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
  .calc-result .detail b { color: var(--text); }
  .calc-result .usd-small { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

  footer { text-align: center; color: var(--text-faint); font-size: 12.5px; padding: 40px 0 50px; line-height: 1.8; }
  #empty { display: none; text-align: center; color: var(--text-dim); padding: 60px 0; font-size: 15px; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .controls { position: static; background: none; backdrop-filter: none; }
    .sort-row .hint { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">LLM</div>
      <h1>大模型 API 价格速查</h1>
    </div>
    <p class="subtitle">主流大模型推理 API 的单位价格（人民币 / 每百万 tokens）。数据由 OpenRouter 与官方定价页每天自动更新，仅供参考，实际以厂商账单为准。</p>
    <div class="badges">
      <span class="updated">数据更新于 <span id="updated-date">—</span></span>
      <span class="rate-badge" id="rate-badge">汇率 —</span>
    </div>
  </header>

  <div class="controls">
    <div class="controls-bar">
      <input id="search" type="text" placeholder="搜索模型名称或 API ID…">
      <div class="view-toggle" id="view-toggle">
        <button data-view="card" class="active">卡片</button>
        <button data-view="table">表格</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="sort-row">
      <span>排序：</span>
      <button data-sort="provider" class="active">按厂商</button>
      <button data-sort="price_in">输入价 ↑</button>
      <button data-sort="price_out">输出价 ↓</button>
      <span class="hint" id="sort-hint">表格模式下可点击表头排序</span>
      <button id="toggle-hidden" class="btn-hidden">已隐藏 (0)</button>
      <button id="reset-hidden">恢复全部</button>
    </div>
  </div>

  <div id="empty">没有找到匹配的模型，换个关键词试试？</div>

  <div id="content"></div>

  <section class="calc">
    <h2>💡 成本估算器</h2>
    <p class="desc">输入你的 token 用量，估算一次调用或一个月的费用（按当前汇率换算成人民币）。</p>
    <div class="calc-grid">
      <div class="calc-field">
        <label>选择模型</label>
        <select id="calc-model"></select>
      </div>
      <div class="calc-field">
        <label>输入 tokens（百万）</label>
        <input id="calc-in" type="number" min="0" step="0.1" value="1">
      </div>
      <div class="calc-field">
        <label>输出 tokens（百万）</label>
        <input id="calc-out" type="number" min="0" step="0.1" value="0.2">
      </div>
    </div>
    <div class="calc-result">
      <div class="big" id="calc-total">¥0.00</div>
      <div class="detail" id="calc-detail"></div>
      <div class="usd-small" id="calc-usd"></div>
    </div>
  </section>

  <footer>
    数据来源：OpenRouter Models API + 各厂商官方定价页（每天 10:00 自动更新）<br>
    汇率为公开接口实时抓取，价格会随厂商政策变动，请以官网最新页面为准
  </footer>
</div>

<script src="data.js?v=f0b7bcd9"></script>
<script>
const PROVIDERS = (window.PRICING_DATA && window.PRICING_DATA.providers) || [];
const RATE = (window.PRICING_DATA && window.PRICING_DATA.cnyRate) || 7.2;

document.getElementById("updated-date").textContent = (window.PRICING_DATA && window.PRICING_DATA.updatedAt) || "—";
document.getElementById("rate-badge").textContent = "汇率 USD 1 = ¥" + RATE.toFixed(2);

/* ============ 隐藏功能状态 ============ */
const HIDE_KEY = "llm-hidden-models";
let hiddenSet = new Set();
try { hiddenSet = new Set(JSON.parse(localStorage.getItem(HIDE_KEY) || "[]")); } catch (e) {}
let showHidden = false;
function hideKey(provider, model) { return provider.id + ":" + model.api; }
function isHidden(provider, model) { return hiddenSet.has(hideKey(provider, model)); }
function saveHidden() { localStorage.setItem(HIDE_KEY, JSON.stringify([...hiddenSet])); }
function toggleHidden(provider, model) {
  const k = hideKey(provider, model);
  if (hiddenSet.has(k)) hiddenSet.delete(k); else hiddenSet.add(k);
  saveHidden();
}

/* ============ 状态 ============ */
const content = document.getElementById("content");
const chips = document.getElementById("chips");
const search = document.getElementById("search");
const empty = document.getElementById("empty");
let currentProvider = "all";
let currentSort = "provider";
let viewMode = "card";
let tableSort = { key: "provider", dir: 1 };

/* ============ 工具 ============ */
function fmtUSD(v) {
  if (v === undefined || v === null) return "—";
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: v < 1 ? 2 : v < 10 ? 2 : 0, maximumFractionDigits: 4 });
}
// 以下两个函数接收"人民币"金额（已经是 CNY），只负责格式化
function fmtCNY(cny) {
  if (cny === undefined || cny === null) return "—";
  return "¥" + cny.toLocaleString("zh-CN", { minimumFractionDigits: cny < 1 ? 2 : 0, maximumFractionDigits: 2 });
}
function fmtCNYexact(cny) {
  if (cny === undefined || cny === null) return "—";
  return "¥" + cny.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// 币种换算：USD 计价的厂商按汇率换算成人民币；CNY 计价的厂商（官方直连价）直接用人民币
function toCNY(provider, price) {
  return provider.currency === "CNY" ? price : price * RATE;
}
function toUSD(provider, price) {
  return provider.currency === "CNY" ? price / RATE : price;
}
// 徽章配色：按徽章文本映射到语义色（绿=最便宜，品牌=旗舰，琥珀=顶级，蓝=推理，灰=轻量）
function badgeColorClass(badge, flag, hidden) {
  if (hidden) return "hidden";
  if (flag) return "flag";
  const map = {
    "最便宜": "green", "便宜": "green",
    "旗舰": "brand", "最强": "brand", "新一代": "brand", "经典": "brand",
    "顶级": "amber", "Pro": "amber",
    "推理": "blue",
    "轻量": "neutral", "最快": "neutral",
    "优惠": "teal"
  };
  return map[badge] || "";
}

/* ============ 视觉锚点：每厂商最便宜模型 ============ */
let cheapestSet = new Set();
function computeCheapest() {
  cheapestSet = new Set();
  PROVIDERS.forEach(p => {
    const visible = p.models.filter(m => !isHidden(p, m));
    if (!visible.length) return;
    const min = Math.min(...visible.map(m => toCNY(p, m.input)));
    visible.forEach(m => { if (toCNY(p, m.input) === min) cheapestSet.add(hideKey(p, m)); });
  });
}

function buildChips() {
  chips.innerHTML = "";
  const all = [{ id: "all", name: "全部", color: "#888" }].concat(PROVIDERS);
  all.forEach(p => {
    const count = p.id === "all" ? PROVIDERS.reduce((s, x) => s + x.models.length, 0) : p.models.length;
    const b = document.createElement("button");
    b.className = "chip" + (p.id === currentProvider ? " active" : "");
    b.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name} <span class="count">${count}</span>`;
    b.onclick = () => { currentProvider = p.id; buildChips(); render(); };
    chips.appendChild(b);
  });
}

function filteredModels() {
  let out = [];
  PROVIDERS.forEach(p => {
    if (currentProvider !== "all" && currentProvider !== p.id) return;
    p.models.forEach(m => {
      const hidden = isHidden(p, m);
      if (hidden && !showHidden) return;   // 隐藏的默认不显示
      if (search.value.trim()) {
        const q = search.value.trim().toLowerCase();
        if (!(m.name.toLowerCase().includes(q) || m.api.toLowerCase().includes(q) || p.name.toLowerCase().includes(q))) return;
      }
      out.push({ provider: p, model: m, hidden });
    });
  });
  if (currentSort === "price_in") out.sort((a, b) => toCNY(a.provider, a.model.input) - toCNY(b.provider, b.model.input));
  else if (currentSort === "price_out") out.sort((a, b) => toCNY(b.provider, b.model.output) - toCNY(a.provider, a.model.output));
  return out;
}

/* ============ 卡片视图 ============ */
function card(provider, model, hidden, index) {
  const el = document.createElement("div");
  el.className = "card" + (hidden ? " hidden-model" : "");
  el.style.animationDelay = (index % 28) * 22 + "ms";
  const isCheapest = cheapestSet.has(hideKey(provider, model));
  const effBadge = model.badge || (isCheapest ? "最便宜" : "");
  const badgeCls = hidden ? " hidden" : badgeColorClass(effBadge, model.flag, hidden);
  const badgeText = hidden ? "已隐藏" : effBadge;
  el.innerHTML = `
    <div class="card-top">
      <div>
        <div class="model-name">${model.name}</div>
        <div class="api-id">${model.api}</div>
      </div>
      ${badgeText ? `<span class="model-badge${badgeCls}">${badgeText}</span>` : ""}
    </div>
    <div class="prices">
      <div class="price-box">
        <div class="price-label">输入<small class="tag">IN</small></div>
        <div class="price-value">${fmtCNY(toCNY(provider, model.input))}</div>
        <div class="price-unit">/MTok · <span class="usd">${fmtUSD(toUSD(provider, model.input))}</span></div>
      </div>
      <div class="price-box">
        <div class="price-label">输出<small class="tag">OUT</small></div>
        <div class="price-value">${fmtCNY(toCNY(provider, model.output))}</div>
        <div class="price-unit">/MTok · <span class="usd">${fmtUSD(toUSD(provider, model.output))}</span></div>
      </div>
    </div>
    <div class="meta">
      <span class="meta-tag">${provider.name}</span>
      ${model.ctx && model.ctx !== "—" ? `<span class="meta-tag">上下文 ${model.ctx}</span>` : ""}
      <button class="btn-hide${hidden ? " restore" : ""}">${hidden ? "恢复" : "隐藏"}</button>
    </div>
    ${model.note ? `<p class="note">${model.note}</p>` : ""}
  `;
  el.querySelector(".btn-hide").onclick = () => { toggleHidden(provider, model); render(); };
  return el;
}

function renderCard(list) {
  content.innerHTML = "";
  let idx = 0;
  if (currentSort === "provider") {
    PROVIDERS.forEach(p => {
      if (currentProvider !== "all" && currentProvider !== p.id) return;
      const items = list.filter(x => x.provider.id === p.id);
      if (!items.length) return;
      const section = document.createElement("div");
      section.className = "provider";
      section.innerHTML = `
        <div class="provider-head">
          <div class="provider-logo" style="background:${p.color}">${p.short.slice(0,1)}</div>
          <span class="provider-name">${p.name}</span>${p.unofficial ? ' <span class="t-badge t-unofficial">非官方</span>' : ''}
          <a class="provider-site" href="${p.site}" target="_blank" rel="noopener">官方定价 ↗</a>
        </div>
        ${p.note ? `<p class="note" style="margin:0 0 12px">${p.note}</p>` : ""}
        <div class="grid"></div>`;
      const grid = section.querySelector(".grid");
      items.forEach(x => grid.appendChild(card(x.provider, x.model, x.hidden, idx++)));
      content.appendChild(section);
    });
  } else {
    const section = document.createElement("div");
    section.className = "provider";
    const grid = document.createElement("div");
    grid.className = "grid";
    list.forEach(x => grid.appendChild(card(x.provider, x.model, x.hidden, idx++)));
    section.appendChild(grid);
    content.appendChild(section);
  }
}

/* ============ 表格视图 ============ */
function sortTable(list) {
  const { key, dir } = tableSort;
  const val = x => {
    switch (key) {
      case "provider": return x.provider.name;
      case "model": return x.model.name;
      case "input": return toCNY(x.provider, x.model.input);
      case "output": return toCNY(x.provider, x.model.output);
      case "ctx": return x.model.ctx === "—" ? 0 : parseInt(x.model.ctx) || 0;
      default: return x.provider.name;
    }
  };
  return [...list].sort((a, b) => {
    const va = val(a), vb = val(b);
    if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
    return String(va).localeCompare(String(vb)) * dir;
  });
}

function renderTable(list) {
  content.innerHTML = "";
  const sorted = sortTable(list);
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  const arrow = (k) => tableSort.key === k ? (tableSort.dir === 1 ? "▲" : "▼") : "";
  const th = (label, key) => `<th data-key="${key}">${label}<span class="arrow">${arrow(key)}</span></th>`;
  wrap.innerHTML = `
    <table>
      <thead>
        <tr>${th("厂商", "provider")}${th("模型", "model")}${th("API ID", "")}${th("上下文", "ctx")}${th("输入 ¥/MTok", "input")}${th("输出 ¥/MTok", "output")}${th("备注", "")}${th("操作", "")}</tr>
      </thead>
      <tbody></tbody>
    </table>`;
  const tbody = wrap.querySelector("tbody");
  sorted.forEach((x, i) => {
    const m = x.model, p = x.provider, hidden = x.hidden;
    const isCheapest = cheapestSet.has(hideKey(p, m));
    const effBadge = m.badge || (isCheapest ? "最便宜" : "");
    const badgeCls = hidden ? " hidden" : badgeColorClass(effBadge, m.flag, hidden);
    const badgeText = hidden ? "已隐藏" : effBadge;
    const tr = document.createElement("tr");
    tr.style.animationDelay = (i % 40) * 18 + "ms";
    tr.className = hidden ? "hidden-model" : "";
    tr.innerHTML = `
      <td><span class="t-provider"><span class="dot" style="background:${p.color}"></span>${p.name}${p.unofficial ? ' <span class="t-badge t-unofficial">非官方</span>' : ''}</span></td>
      <td><span class="t-model-name">${m.name}</span>${badgeText ? ` <span class="t-badge${badgeCls}">${badgeText}</span>` : ""}</td>
      <td class="t-api">${m.api}</td>
      <td>${m.ctx && m.ctx !== "—" ? m.ctx : "—"}</td>
      <td class="t-price t-input">${fmtCNYexact(toCNY(p, m.input))}<span class="usd">${fmtUSD(toUSD(p, m.input))}</span></td>
      <td class="t-price t-output">${fmtCNYexact(toCNY(p, m.output))}<span class="usd">${fmtUSD(toUSD(p, m.output))}</span></td>
      <td class="t-note">${m.note || ""}</td>
      <td><button class="btn-hide-cell${hidden ? " restore" : ""}">${hidden ? "恢复" : "隐藏"}</button></td>`;
    tr.querySelector(".btn-hide-cell").onclick = () => { toggleHidden(p, m); render(); };
    tbody.appendChild(tr);
  });
  wrap.querySelectorAll("thead th[data-key]").forEach(h => {
    h.addEventListener("click", () => {
      const k = h.dataset.key;
      if (tableSort.key === k) tableSort.dir *= -1;
      else { tableSort.key = k; tableSort.dir = 1; }
      renderTable(filteredModels());
    });
  });
  content.appendChild(wrap);
}

function render() {
  computeCheapest();
  const list = filteredModels();
  empty.style.display = list.length ? "none" : "block";
  const hiddenCount = hiddenSet.size;
  const btn = document.getElementById("toggle-hidden");
  btn.textContent = showHidden ? "当前显示已隐藏" : `已隐藏 (${hiddenCount})`;
  btn.classList.toggle("active", showHidden);
  if (viewMode === "table") renderTable(list);
  else renderCard(list);
}

/* ============ 事件 ============ */
search.addEventListener("input", render);
document.querySelectorAll(".sort-row button[data-sort]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".sort-row button[data-sort]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentSort = btn.dataset.sort;
    render();
  });
});
document.getElementById("toggle-hidden").addEventListener("click", () => {
  showHidden = !showHidden;
  render();
});
document.getElementById("reset-hidden").addEventListener("click", () => {
  hiddenSet.clear();
  showHidden = false;
  saveHidden();
  render();
});
document.querySelectorAll("#view-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#view-toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    viewMode = btn.dataset.view;
    const hint = document.getElementById("sort-hint");
    hint.style.display = viewMode === "table" ? "" : "none";
    render();
  });
});

/* ============ 成本估算器 ============ */
const calcModel = document.getElementById("calc-model");
const calcIn = document.getElementById("calc-in");
const calcOut = document.getElementById("calc-out");
const calcTotal = document.getElementById("calc-total");
const calcDetail = document.getElementById("calc-detail");
const calcUsd = document.getElementById("calc-usd");

function buildCalcOptions() {
  PROVIDERS.forEach(p => {
    p.models.forEach(m => {
      if (isHidden(p, m)) return;   // 隐藏的模型不出现在估算器里
      const opt = document.createElement("option");
      opt.value = JSON.stringify({ pid: p.id, in: m.input, out: m.output });
      opt.textContent = `${p.name} · ${m.name}`;
      calcModel.appendChild(opt);
    });
  });
}
function updateCalc() {
  const d = JSON.parse(calcModel.value);
  const provider = PROVIDERS.find(p => p.id === d.pid);
  const inM = parseFloat(calcIn.value) || 0;
  const outM = parseFloat(calcOut.value) || 0;
  const cny = toCNY(provider, d.in) * inM + toCNY(provider, d.out) * outM;
  calcTotal.textContent = fmtCNYexact(cny);
  calcDetail.innerHTML = `输入 ${inM}M × <b>${fmtCNYexact(toCNY(provider, d.in))}</b> + 输出 ${outM}M × <b>${fmtCNYexact(toCNY(provider, d.out))}</b>`;
  calcUsd.textContent = `≈ ${fmtUSD(cny / RATE)}（汇率 USD 1 = ¥${RATE.toFixed(2)}）`;
}
[calcModel, calcIn, calcOut].forEach(el => el.addEventListener("input", updateCalc));

/* ============ 初始化 ============ */
buildChips();
buildCalcOptions();
render();
updateCalc();
</script>
</body>
